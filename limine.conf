timeout: 5
interface_branding: BrysOS 98 - Programa de instalacion
interface_branding_colour: 6

/BrysOS 98 (instalar o probar)
    protocol: multiboot2
    path: boot():/boot/kernel.elf
    cmdline: live
    module_path: boot():/boot/kernel.elf
    module_string: kernel.elf
    module_path: boot():/boot/grub/boot.img
    module_string: boot.img
    module_path: boot():/boot/grub/core.img
    module_string: core.img
    module_path: boot():/boot/grub/grubx64.efi
    module_string: grubx64.efi
